version: 2
updates:
  # python
  - package-ecosystem: "uv"
    directory: "app/"
    schedule:
      interval: "monthly"
  # terraform
  - package-ecosystem: "terraform"
    directory: "terraform/"
    schedule:
      interval: "monthly"
  # github actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
