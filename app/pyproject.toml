[project]
name = "gcp-billing-reporter"
version = "0.1.0"
description = "A tool for reporting GCP billing data"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "loguru~=0.7.3",
  "slack-sdk~=3.41.0",
  "python-dateutil~=2.9.0",
  "google-cloud-bigquery~=3.41.0",
  "google-cloud-secret-manager~=2.27.0",
  "google-crc32c~=1.8.0",
  "pandas~=2.3.3",
  "db-dtypes~=1.5.1",
  "functions-framework~=3.10.1",
  "cloudevents~=1.12.0"
]

[dependency-groups]
dev = ["pandas-stubs~=3.0.0.260204", "types-python-dateutil~=2.9.0.20260408"]
test = [
    "pytest~=9.0.3",
    "pytest-console-scripts~=1.4.1",
    "pytest-mock~=3.15.1",
]
lint = ["ruff~=0.15.12", "mypy~=1.20.2"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
markers = [
  "live: tests that call live GCP and Slack integrations",
]

[tool.mypy]
python_version = "3.14"
exclude = [".venv"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "google_crc32c"
ignore_missing_imports = true
